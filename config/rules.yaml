rfm:
  lookback_days: 365
  score_min: 1
  score_max: 5
  boundary_rule: "equal_cutoff_gets_higher_score"
segments:
  lifecycle:
    - CONSENT_SUPPRESSED
    - NEW
    - CHAMPIONS
    - LOYAL
    - AT_RISK
    - DORMANT
    - PROMISING
  overlays:
    - HIGH_SERVICE_COST
    - HIGH_RETURNER
    - VALUE_TIER_PREMIUM
suppression:
  marketing_contacts_7d: 2
  marketing_contacts_30d: 6
  recent_return_dispute_days: 7
actions:
  response_coefficients:
    intercept: -2.0
    engagement: 0.25
    service_case: -0.5
distribution_targets:
  champions_lifecycle_share: [0.05, 0.15]
  lifecycle_dormant_share: [0.15, 0.20]
  lifecycle_new_share: [0.10, 0.15]
  return_value_share: [0.05, 0.08]
  marketing_withdrawal_share: [0.03, 0.05]
  order_lines_per_order: [1.8, 3.2]
  zero_order_share: [0.15, 0.20]
  last12m_zero_order_share: [0.15, 0.30]
  high_service_cost_share: [0.07, 0.10]
  median_orders_per_customer: [2, 5]
  p95_orders_per_customer_min: 10
overlay_thresholds:
  high_service_cost_ratio: 0.22
  high_service_case_count_90d: 3
